name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5  # Atualizado para a versão 5
      with:
        python-version: '3.x'

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install robotframework-allure2

    - name: Run Robot Framework tests
      run: |
        robot --listener allure_robotframework ./tests/bdd_cases.robot

    - name: Generate Allure Report
      run: |
        allure generate ./results -o ./allure-report

    - name: Upload Allure report
      uses: actions/upload-artifact@v3
      with:
        name: allure-report
        path: ./allure-report

    - name: Upload Robot Framework reports
      uses: actions/upload-artifact@v3
      with:
        name: robot-framework-reports
        path: ./logs

    - name: Send report to commit
      if: github.event_name == 'pull_request'
      uses: joonvena/robotframework-reporter-action@v2.4
      with:
        gh_access_token: ${{ secrets.GITHUB_TOKEN }}
        sha: ${{ github.sha }}
        pull_request_id: ${{ github.event.number }}
